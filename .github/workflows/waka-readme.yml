name: Waka Readme

on:
  schedule:
    - cron: '0 17 * * *' # Daily at 5:00 PM UTC (12:00 AM Cambodia time, UTC+7)
    - cron: '0 5 * * *'  # Daily at 5:00 AM UTC (12:00 PM Cambodia time, UTC+7)
  workflow_dispatch:

jobs:
  update-readme:
    name: Auto update README with metrics
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHOW_PROFILE_VIEWS: "False"
          SHOW_OS: "True"
          SHOW_PROJECTS: "False"
          SHOW_EDITORS: "True"
          SHOW_LOC_CHART: "False"
          SHOW_LANGUAGE: "True"
          SHOW_LINES_OF_CODE: "True"
          SHOW_TOTAL_CODE_TIME: "True"
          SHOW_AI_CODE_TIME: "True"
          SHOW_AI_CODING: "True"
          DEBUG_LOGGING: "true"
